# Publishes the app to GitHub Pages and refreshes warnings.json from FMI every 15 minutes.
# FMI's warning feed has no CORS header, so the browser can't read it directly.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # keepalive commit only
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # If FMI is unreachable the step fails and the previous deployment stays live,
      # rather than publishing an empty list that would look like "no warnings"
      - name: Build site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.json icons .nojekyll _site/
          python3 scripts/build_warnings.py _site/warnings.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without commits
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit --allow-empty -m "keepalive: scheduled workflows stop after 60 idle days"
            git push
          fi
